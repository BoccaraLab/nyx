[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The import name is `nyx`; the distribution name is `nyx-sleep` because `nyx`
# is already taken on PyPI by an unrelated project.
name = "nyx-sleep"
version = "0.1.0"
description = "A flexible framework for sleep scoring across species, lifespan and modalities"
readme = "README.md"
requires-python = ">=3.10"
# Copyright (c) C. Boccara Lab. See COPYRIGHT.
license = { text = "LGPL-3.0-or-later" }
authors = [
    { name = "Letizia Signorelli" },
    { name = "Solomiia Korchynska" },
    { name = "Cantin Ortiz" },
    { name = "Alessandro Arena" },
    { name = "Sophia Wilhelm" },
    { name = "Charlotte Boccara" },
]
keywords = ["sleep", "EEG", "EMG", "hypnogram", "electrophysiology", "neuroscience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "hdbscan>=0.8.33",
    "spikeinterface>=0.100",
    "mne>=1.5",
    "pyedflib>=0.1.30",
]

[project.optional-dependencies]
# Running the example notebooks.
notebooks = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]
# Interactive matplotlib windows outside a notebook: the polygon cluster
# refinement and the draggable threshold. Both are pure matplotlib -- this
# extra only supplies a Qt backend for them.
interactive = [
    "PySide6>=6.5",
]
# The step-by-step scoring GUI. PySide6 rather than PyQt5 so the Qt stack is
# LGPL like nyx itself; ephyviewer supplies the trace, time-frequency and
# epoch-encoder views.
gui = [
    "PySide6>=6.5",
    "ephyviewer>=1.8",
    "pyqtgraph>=0.13",
]
# Everything. The self-reference has to use the distribution name.
full = [
    "nyx-sleep[notebooks,gui,interactive]",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]
# Developing the GUI. pytest-qt deliberately does *not* live in `dev`: it
# refuses to start at all when no Qt binding is importable, so a Qt-free
# checkout with `dev` installed could not run even the library tests.
dev-gui = [
    "nyx-sleep[gui,dev]",
    "pytest-qt>=4.2",
]

[project.scripts]
# Not gui-scripts: nyx prints as it runs, and on Windows gui-scripts detaches
# the console, so a failure would leave nothing to read.
nyx-gui = "nyx.gui:main"
# Scoring by hand, in whole epochs, after the same recording and signal check.
nyx-manual = "nyx.gui:main_manual"
# ephyviewer's standalone viewer. Its own `ephyviewer` command is broken in
# 1.8.0 (missing __version__); see nyx/gui/standalone.py.
nyx-ephyviewer = "nyx.gui.standalone:main"

[project.urls]
Homepage = "https://github.com/BoccaraLab/nyx"
Issues = "https://github.com/BoccaraLab/nyx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyx = ["params/*.json", "params/README.md"]
"nyx.gui" = ["resources/*.png", "resources/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # zip() without strict=. Worth adopting, but not in one sweep: strict=True
    # turns a length mismatch from silent truncation into a ValueError at
    # runtime, and the sequences here come from several different readers. New
    # code passes it explicitly; the existing sites want checking one at a
    # time against what their inputs can actually be.
    "B905",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: needs a Qt binding and ephyviewer"]
