[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The import name is `nyx`; the distribution name is `nyx-sleep` because `nyx`
# is already taken on PyPI by an unrelated project.
name = "nyx-sleep"
version = "0.1.0"
description = "A flexible framework for sleep scoring across species, lifespan and modalities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [
    { name = "Letizia Signorelli" },
    { name = "Solomiia Korchynska" },
    { name = "Cantin Ortiz" },
    { name = "Alessandro Arena" },
    { name = "Sophia Wilhelm" },
    { name = "Charlotte Boccara" },
]
keywords = ["sleep", "EEG", "EMG", "hypnogram", "electrophysiology", "neuroscience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "hdbscan>=0.8.33",
    "spikeinterface>=0.100",
    "mne>=1.5",
    "pyedflib>=0.1.30",
]

[project.optional-dependencies]
# Running the example notebooks.
notebooks = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]
# Interactive polygon-based cluster refinement in a Qt window.
interactive = [
    "PyQt5",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/lsignorelli/nyx"
Issues = "https://github.com/lsignorelli/nyx/issues"

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: params/ still lives at the repo root, so it is not installed with the
# package yet. Moving the default parameter files under src/nyx/params/ (and
# adding them here as package-data) is part of the params reorganisation.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
