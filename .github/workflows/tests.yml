name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The library on its own, with no Qt anywhere. This is the job that catches
  # the GUI leaking into the pipeline: nyx.gui.session and its neighbours are
  # meant to be importable without a display, and tests/test_gui_session.py
  # asserts it.
  library:
    name: library (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          # One run each on the platforms people actually score on, so a
          # path-handling or line-ending problem shows up here rather than on
          # someone's laptop.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -m "not gui" -q

  # The GUI, headless. PySide6 needs these libraries even under the offscreen
  # platform plugin -- without them the import succeeds and the first widget
  # segfaults, which is a confusing way to find out.
  gui:
    name: gui (offscreen)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          # PyQt5 is a common transitive dependency, and two bindings in one
          # process is a segfault rather than an ImportError.
          QT_API: pyside6
          PYQTGRAPH_QT_LIB: PySide6
          PYTEST_QT_API: pyside6
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests

  # The wheel has to carry more than the .py files: the parameter presets and
  # the logo are package data, and a missing entry in pyproject means
  # load_params("mouse") fails only after someone installs it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install build
      - run: python -m build

      - name: Install the wheel and use it from somewhere else
        # From /tmp on purpose. The parameter presets used to live at the repo
        # root, so load_params only worked from a directory that happened to
        # have them next to it; running from elsewhere is what proves they are
        # really installed.
        run: |
          pip install dist/*.whl
          cd /tmp
          python - <<'PY'
          import os
          import nyx
          from nyx.gui import branding

          assert "mouse" in nyx.available_params(), nyx.available_params()
          assert nyx.load_params("mouse")["EEG"]
          assert branding.logo_path(), "the logo did not ship"
          print("installed wheel is usable from", os.getcwd())
          PY
